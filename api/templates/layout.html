<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Conflicto en Medio Oriente{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif !important;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .main-title {
            font-weight: 700;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #1e293b;
        }

        .section-header {
            color: #334155;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .metric-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #3b82f6;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .metric-card:hover {
            transform: translateY(-5px);
        }

        .return-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #3b82f6;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .return-btn:hover {
            background-color: #2563eb;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
        }

        .footer-info {
            background-color: #e0f2fe;
            padding: 15px;
            border-radius: 8px;
            color: #0369a1;
            margin-top: 30px;
        }

        .fade-in {
            animation: vanishIn 0.6s ease-out;
        }

        @keyframes vanishIn {
            0% {
                opacity: 0;
                transform: scale(0.98);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="fade-in">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
